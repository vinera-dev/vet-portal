type Appointment {
  id: ID!
  petName: String!
  service: ServiceType!
  start: LocalDateTime!
  status: AppointmentStatus!
  tutorName: String!
}

enum AppointmentStatus {
  CANCELLED
  SCHEDULED
}

input BookAppointmentInput {
  petName: String!
  service: ServiceType!
  start: LocalDateTime!
  tutorName: String!
}

type Clinic {
  closesAt: String!
  name: String!
  opensAt: String!
  slotMinutes: Int!
}

scalar Date

scalar LocalDateTime

type Mutation {
  bookAppointment(input: BookAppointmentInput!): Appointment!
}

type Query {
  clinic: Clinic!
  slots(day: Date!): [Slot!]!
}

enum ServiceType {
  CONSULTATION
  EXAM
  GROOMING
  VACCINATION
}

type Slot {
  start: LocalDateTime!
  time: String!
}